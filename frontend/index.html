<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profiles</title>
    <!-- Inline so the splash paints before the app's CSS and JS arrive; otherwise a
         browser refresh shows a blank white page for a moment. -->
    <style>
      html,
      body {
        margin: 0;
        background: #f5f3fa;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #f5f3fa;
        color: #6d4aa8;
        font: 600 15px/1.5 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.25s ease;
      }
      #app-loader.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #app-loader .app-loader-ring {
        width: 40px;
        height: 40px;
        border: 3px solid #e4dcf3;
        border-top-color: #6d4aa8;
        border-radius: 50%;
        animation: app-loader-spin 0.7s linear infinite;
      }
      @keyframes app-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader .app-loader-ring {
          animation-duration: 1.5s;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loader" role="status" aria-live="polite">
      <div class="app-loader-ring" aria-hidden="true"></div>
      <span>Loading User Profiles…</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
